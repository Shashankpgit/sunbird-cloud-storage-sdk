name: Dependency Submission

on:
  push:
    branches: [v1.4.10]
    paths:
      - "**/pom.xml"
  pull_request:
    branches: [v1.4.10]
    paths:
      - "**/pom.xml"
  # Runs daily at 2:50 PM IST (09:20 UTC)
  schedule:
    - cron: '20 9 * * *'
  # Manual trigger for initial setup or ad-hoc refresh
  workflow_dispatch:

jobs:
  submit-maven-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to submit the dependency snapshot to GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Submit Maven dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v4
