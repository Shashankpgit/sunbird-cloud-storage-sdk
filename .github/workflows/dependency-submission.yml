name: Dependency Submission

on:
  push:
    branches: [master]
    paths:
      - "**/pom.xml"
  pull_request:
    branches: [master]
    paths:
      - "**/pom.xml"
  # Manual trigger for initial setup or ad-hoc refresh
  workflow_dispatch:

# Required to submit the dependency snapshot to the GitHub Dependency Graph
permissions:
  contents: write

jobs:
  submit-maven-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Maven requires a build to resolve the full transitive dependency tree;
      # setup-java with cache: maven avoids re-downloading the local repo on reruns
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # Submits a dependency snapshot so Dependabot can alert on transitive deps,
      # not just the direct dependencies declared in pom.xml
      - name: Submit Maven dependency snapshot
        uses: advanced-security/maven-dependency-submission-action@v4
